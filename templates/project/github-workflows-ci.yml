# RedWork project CI — generated by install.py init.
# One contract with the local gates: the SAME commands slice-gate.sh and the
# wave gates run locally run here. Acceptance is 100%, always.
# Deployment is out of scope for RedWork — see docs/DEPLOYMENT.md.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt || true
          pip install ruff mypy pytest pytest-cov
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Types (mypy)
        working-directory: backend
        run: mypy app/
      - name: Tests with 100% coverage gate
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint (eslint)
        working-directory: frontend
        run: npx eslint src/
      - name: Types (tsc)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Tests with coverage thresholds (100, from vitest.config)
        working-directory: frontend
        run: npx vitest run --coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/security/scan-secrets.sh .
