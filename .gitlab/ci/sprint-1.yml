# ============================================================================
# Child Pipeline: SPRINT 1 (All 5 Waves)
# ============================================================================
# Waves 1-5: domain -> application -> api -> frontend -> integration
# Each wave uses job groups (format: "wave N: <agent>") for visual grouping.
# ============================================================================

include:
  - local: .gitlab/ci/_templates.yml

stages:
  - wave-1-domain
  - wave-2-application
  - wave-3-api
  - wave-3-gate
  - wave-4-frontend
  - wave-5-quality

# ----------------------------------------------------------------------------
# WAVE 1: Domain Layer (Backend core + tests in parallel)
# ----------------------------------------------------------------------------
"wave 1: backend-domain":
  stage: wave-1-domain
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 1 - Backend Domain Layer (Agent 10)"
    DIR_NAME: "backend"
    FILE_PATTERN: "*.py"
    MIN_FILES: "5"

"wave 1: domain-tests":
  stage: wave-1-domain
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 1 - Domain Unit Tests (Agent 13)"
    DIR_NAME: "backend"
    FILE_PATTERN: "test_*.py"
    MIN_FILES: "2"
  needs:
    - "wave 1: backend-domain"

# ----------------------------------------------------------------------------
# WAVE 2: Application Layer
# ----------------------------------------------------------------------------
"wave 2: application-services":
  stage: wave-2-application
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 2 - Application Services (Agent 10)"
    DIR_NAME: "backend"
    FILE_PATTERN: "*_service.py"
    MIN_FILES: "1"
  needs:
    - "wave 1: domain-tests"

"wave 2: application-tests":
  stage: wave-2-application
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 2 - Application Tests (Agent 13)"
    DIR_NAME: "backend"
    FILE_PATTERN: "test_*_service.py"
    MIN_FILES: "1"
  needs:
    - "wave 2: application-services"

# ----------------------------------------------------------------------------
# WAVE 3: API Layer
# ----------------------------------------------------------------------------
"wave 3: fastapi-routers":
  stage: wave-3-api
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 3 - FastAPI Routers (Agent 10)"
    DIR_NAME: "backend"
    FILE_PATTERN: "*_router.py"
    MIN_FILES: "1"
  needs:
    - "wave 2: application-tests"

"wave 3: integration-tests":
  stage: wave-3-api
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 3 - Integration Tests (Agent 13)"
    DIR_NAME: "backend"
    FILE_PATTERN: "test_*.py"
    MIN_FILES: "3"
  needs:
    - "wave 3: fastapi-routers"

# ----------------------------------------------------------------------------
# WAVE 3 GATE: Blocking quality gate (stack-aware)
# ----------------------------------------------------------------------------
"wave 3: BLOCKING GATE":
  stage: wave-3-gate
  extends: .quality-gate
  script:
    - |
      echo ""
      echo "  ================================================"
      echo "  BLOCKING GATE  -  Wave 3 Backend Quality"
      echo "  ================================================"
      mkdir -p reports
      FAIL=0

      STACK="none"
      if [ -f "backend/app/main.py" ]; then
        STACK="fastapi"
      elif [ -f "backend/package.json" ] && grep -q "@nestjs" backend/package.json 2>/dev/null; then
        STACK="nestjs-legacy"
      fi
      echo "  Stack detected: $STACK"
      echo ""

      if [ "$STACK" = "nestjs-legacy" ]; then
        echo "  MODE: Legacy NestJS (tolerant checks)"
        echo "  [1/2] package.json syntax..."
        [ -f backend/package.json ] && node -e "JSON.parse(require('fs').readFileSync('backend/package.json'))" && echo "        OK" || echo "        WARN"
        echo "  [2/2] TypeScript files present..."
        find backend/src -name "*.ts" -type f 2>/dev/null | head -1 | grep -q . && echo "        OK" || echo "        WARN"
        echo ""
        echo "  >> BLOCKING GATE: PASS (legacy mode)"
        exit 0
      fi

      if [ "$STACK" != "fastapi" ]; then
        echo "  No backend detected. Skipping strict checks."
        echo "  >> BLOCKING GATE: PASS (no backend)"
        exit 0
      fi

      echo "  MODE: FastAPI (strict checks)"
      echo "  [1/4] Python syntax..."
      command -v python3 >/dev/null 2>&1 && find backend -name "*.py" -exec python3 -m py_compile {} \; 2>reports/syntax.log || echo "        SKIP"

      echo "  [2/4] FastAPI imports..."
      if grep -r "from fastapi" backend/app 2>/dev/null | head -1 >/dev/null; then
        echo "        OK"
      else
        echo "        FAIL"
        FAIL=1
      fi

      echo "  [3/4] NestJS contamination check..."
      if grep -rE "from '@nestjs|import.*nestjs" backend/ 2>/dev/null | head -1 >/dev/null; then
        echo "        FAIL (NestJS imports in FastAPI backend)"
        FAIL=1
      else
        echo "        OK"
      fi

      echo "  [4/4] Hardcoded secrets..."
      if grep -rEi "(secret|password|token).*=.*['\"][^'\"]{8,}['\"]" backend/app 2>/dev/null | grep -v "Field\|settings\." | head -1 >/dev/null; then
        echo "        WARN"
      else
        echo "        OK"
      fi

      echo ""
      if [ $FAIL -eq 1 ]; then
        echo "  >> BLOCKING GATE: FAIL"
        exit 1
      fi
      echo "  >> BLOCKING GATE: PASS"
  needs:
    - "wave 3: integration-tests"

# ----------------------------------------------------------------------------
# WAVE 4: Frontend
# ----------------------------------------------------------------------------
"wave 4: frontend-components":
  stage: wave-4-frontend
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 4 - Frontend Components (Agent 11)"
    DIR_NAME: "frontend"
    FILE_PATTERN: "*.tsx"
    MIN_FILES: "3"
  needs:
    - "wave 3: BLOCKING GATE"

"wave 4: frontend-tests":
  stage: wave-4-frontend
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 4 - Frontend Tests (Agent 14)"
    DIR_NAME: "frontend"
    FILE_PATTERN: "*.test.tsx"
    MIN_FILES: "2"
  needs:
    - "wave 4: frontend-components"

# ----------------------------------------------------------------------------
# WAVE 5: Quality (integration, E2E, smoke run in parallel)
# ----------------------------------------------------------------------------
"wave 5: integration-tests":
  stage: wave-5-quality
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 5 - Integration Tests (Agent 15)"
    DIR_NAME: "backend"
    FILE_PATTERN: "test_integration_*.py"
    MIN_FILES: "1"
  needs:
    - "wave 4: frontend-tests"

"wave 5: e2e-tests":
  stage: wave-5-quality
  extends: .wait-for-directory
  variables:
    AGENT_LABEL: "Wave 5 - E2E Tests (Agent 16)"
    DIR_NAME: "e2e"
    FILE_PATTERN: "*.spec.ts"
    MIN_FILES: "1"
  needs:
    - "wave 4: frontend-tests"

"wave 5: smoke-tests":
  stage: wave-5-quality
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Wave 5 - Smoke Tests (Agent 18)"
    FILE_NAME: "outputs/18_smoke_test_report.md"
    REQUIRED_SECTIONS: "Smoke Test|Status"
  needs:
    - "wave 5: integration-tests"
