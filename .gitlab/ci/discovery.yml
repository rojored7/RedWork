# ============================================================================
# Child Pipeline: DISCOVERY
# ============================================================================
# Agents 01 through 05 + Agent 04b (Security by Design)
# ============================================================================

include:
  - local: .gitlab/ci/_templates.yml

stages:
  - product
  - domain
  - context
  - architecture
  - security-design
  - service-design

# ----------------------------------------------------------------------------
# STAGE: product
# ----------------------------------------------------------------------------
"01: product-discovery":
  stage: product
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 01 - Product Discovery"
    FILE_NAME: "outputs/01_product_discovery.md"
    REQUIRED_SECTIONS: "Product Vision|Problem Statement|System Objectives"
  environment:
    name: agents/discovery/01-product
    action: prepare
  when: manual
  allow_failure: false

# ----------------------------------------------------------------------------
# STAGE: domain
# ----------------------------------------------------------------------------
"02: domain-modeling":
  stage: domain
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 02 - Domain Modeling"
    FILE_NAME: "outputs/02_domain_model.md"
    # Flexible section matching (case-insensitive, supports EN and ES)
    REQUIRED_SECTIONS: "Entities|Value Objects|Aggregates"
  environment:
    name: agents/discovery/02-domain
    action: prepare
  needs:
    - "01: product-discovery"

# ----------------------------------------------------------------------------
# STAGE: context
# ----------------------------------------------------------------------------
"03: context-mapping":
  stage: context
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 03 - Context Mapping"
    FILE_NAME: "outputs/03_context_map.md"
    REQUIRED_SECTIONS: "Bounded Contexts|Context Relationships"
  environment:
    name: agents/discovery/03-context
    action: prepare
  needs:
    - "02: domain-modeling"

# ----------------------------------------------------------------------------
# STAGE: architecture
# ----------------------------------------------------------------------------
"04: architecture-decision":
  stage: architecture
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 04 - Architecture Decision"
    FILE_NAME: "outputs/04_architecture_decision.md"
    REQUIRED_SECTIONS: "Architectural Decision|Deployment|Scalability"
  environment:
    name: agents/discovery/04-architecture
    action: prepare
  needs:
    - "03: context-mapping"
  after_script:
    - |
      printf "\n"
      printf "  >> FastAPI mandate check...\n"
      if [ -f outputs/04_architecture_decision.md ]; then
        if grep -qi "FastAPI" outputs/04_architecture_decision.md; then
          printf "  >> \e[32mOK\e[0m    | FastAPI mentioned\n"
        elif grep -qi "NestJS" outputs/04_architecture_decision.md; then
          printf "  >> \e[33mWARN\e[0m  | NestJS detected (legacy project, tolerated)\n"
        else
          printf "  >> \e[33mWARN\e[0m  | Backend framework not detected in document\n"
        fi
      fi

# ----------------------------------------------------------------------------
# STAGE: security-design (parallel with service-design)
# ----------------------------------------------------------------------------
"04b: security-by-design":
  stage: security-design
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 04b - Security by Design"
    FILE_NAME: "outputs/04b_security_requirements.md"
    REQUIRED_SECTIONS: "OWASP|Authentication|Authorization"
  environment:
    name: agents/discovery/04b-security
    action: prepare
  needs:
    - "04: architecture-decision"

# ----------------------------------------------------------------------------
# STAGE: service-design
# ----------------------------------------------------------------------------
"05: service-design":
  stage: service-design
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 05 - Service Design"
    FILE_NAME: "outputs/05_service_design.md"
    REQUIRED_SECTIONS: "Service Design|Clean Architecture|Domain Layer"
  environment:
    name: agents/discovery/05-service
    action: prepare
  needs:
    - "04: architecture-decision"

"05b: design-validator":
  stage: service-design
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 05b - Technical Design Validator (BLOCKING GATE)"
    FILE_NAME: "outputs/05b_design_validation_report.md"
    REQUIRED_SECTIONS: "VERDICT|Validation"
  environment:
    name: agents/discovery/05b-validator
    action: prepare
  needs:
    - "05: service-design"
    - "04b: security-by-design"
  after_script:
    - |
      printf "\n"
      if [ -f outputs/05b_design_validation_report.md ]; then
        if grep -qiE "VERDICT.*PASS" outputs/05b_design_validation_report.md; then
          printf "  >> \e[42m\e[37m\e[1m [ GATE PASS ] \e[0m Design approved for planning phase\n"
        elif grep -qiE "VERDICT.*(FAIL|BLOCKED)" outputs/05b_design_validation_report.md; then
          printf "  >> \e[41m\e[37m\e[1m [ GATE FAIL ] \e[0m Design has unresolved issues\n"
          exit 1
        else
          printf "  >> \e[43m\e[1m [ GATE WARN ] \e[0m Verdict unclear, review manually\n"
        fi
      fi
