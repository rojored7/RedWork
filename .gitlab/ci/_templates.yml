# ============================================================================
# Shared Templates for All Child Pipelines
# ============================================================================
# Reusable job templates. Included in every child pipeline.
# ============================================================================

variables:
  FRAMEWORK_BRANCH: "framework"
  OUTPUTS_DIR: "outputs"
  MAX_WAIT_SECONDS: "3600"
  CHECK_INTERVAL: "30"
  # ANSI color codes (visible in GitLab job logs)
  C_RESET: "\e[0m"
  C_BOLD: "\e[1m"
  C_RED: "\e[31m"
  C_GREEN: "\e[32m"
  C_YELLOW: "\e[33m"
  C_BLUE: "\e[34m"
  C_MAGENTA: "\e[35m"
  C_CYAN: "\e[36m"
  C_WHITE: "\e[37m"
  C_BG_GREEN: "\e[42m"
  C_BG_RED: "\e[41m"
  C_BG_YELLOW: "\e[43m"
  C_BG_BLUE: "\e[44m"

default:
  image: alpine:3.19
  before_script:
    - apk add --no-cache git bash grep coreutils findutils >/dev/null
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ----------------------------------------------------------------------------
# Template: .wait-for-file
# Waits for a single agent output file to appear and validates sections.
# ----------------------------------------------------------------------------
.wait-for-file:
  timeout: 2h
  script:
    - |
      printf "\n"
      printf "${C_BOLD}${C_CYAN}  ============================================================${C_RESET}\n"
      printf "${C_BOLD}${C_CYAN}  >> %s${C_RESET}\n" "$AGENT_LABEL"
      printf "${C_BOLD}${C_CYAN}  ============================================================${C_RESET}\n"
      printf "${C_WHITE}  File:     ${C_YELLOW}%s${C_RESET}\n" "$FILE_NAME"
      printf "${C_WHITE}  Sections: ${C_YELLOW}%s${C_RESET}\n" "$REQUIRED_SECTIONS"
      printf "${C_CYAN}  ------------------------------------------------------------${C_RESET}\n"

      ELAPSED=0
      while [ $ELAPSED -lt $MAX_WAIT_SECONDS ]; do
        PCT=$((ELAPSED * 100 / MAX_WAIT_SECONDS))
        printf "${C_BLUE}  [%3d%%]${C_RESET} Waiting for ${C_YELLOW}%s${C_RESET}\n" "$PCT" "$FILE_NAME"

        git fetch origin "$FRAMEWORK_BRANCH" --quiet 2>/dev/null || true
        git checkout "origin/$FRAMEWORK_BRANCH" -- "$FILE_NAME" 2>/dev/null || true

        if [ -f "$FILE_NAME" ]; then
          printf "\n"
          printf "${C_GREEN}  >> File detected:${C_RESET} %s\n" "$FILE_NAME"
          printf "${C_CYAN}  >> Validating sections...${C_RESET}\n"

          MISSING=""
          FOUND_LIST=""
          OLD_IFS="$IFS"
          IFS='|'
          for section in $REQUIRED_SECTIONS; do
            if grep -qi "$section" "$FILE_NAME"; then
              FOUND_LIST="$FOUND_LIST '$section'"
            else
              MISSING="$MISSING '$section'"
            fi
          done
          IFS="$OLD_IFS"

          if [ -z "$MISSING" ]; then
            LINES=$(wc -l < "$FILE_NAME")
            SIZE=$(wc -c < "$FILE_NAME")
            printf "\n"
            printf "${C_GREEN}  Found sections:${C_RESET}%s\n" "$FOUND_LIST"
            printf "${C_BG_GREEN}${C_WHITE}${C_BOLD}  [ PASS ] ${C_RESET} lines=%s size=%sB\n" "$LINES" "$SIZE"
            printf "\n"
            exit 0
          else
            printf "\n"
            printf "${C_GREEN}  Found sections:${C_RESET}%s\n" "$FOUND_LIST"
            printf "${C_RED}  Missing sections:${C_RESET}%s\n" "$MISSING"
            printf "${C_BG_RED}${C_WHITE}${C_BOLD}  [ FAIL ] ${C_RESET} %s\n" "required sections not found"
            exit 1
          fi
        fi

        sleep "$CHECK_INTERVAL"
        ELAPSED=$((ELAPSED + CHECK_INTERVAL))
      done

      printf "\n"
      printf "${C_BG_YELLOW}${C_BOLD}  [ TIMEOUT ] ${C_RESET} after %ss\n" "$MAX_WAIT_SECONDS"
      exit 1
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - "$FILE_NAME"
    expire_in: 30 days
    when: on_success

# ----------------------------------------------------------------------------
# Template: .wait-for-directory
# Waits for a directory to be populated with N files.
# ----------------------------------------------------------------------------
.wait-for-directory:
  timeout: 2h
  script:
    - |
      printf "\n"
      printf "${C_BOLD}${C_MAGENTA}  ============================================================${C_RESET}\n"
      printf "${C_BOLD}${C_MAGENTA}  >> %s${C_RESET}\n" "$AGENT_LABEL"
      printf "${C_BOLD}${C_MAGENTA}  ============================================================${C_RESET}\n"
      printf "${C_WHITE}  Directory: ${C_YELLOW}%s${C_RESET}\n" "$DIR_NAME"
      printf "${C_WHITE}  Pattern:   ${C_YELLOW}%s${C_RESET}\n" "$FILE_PATTERN"
      printf "${C_WHITE}  Min files: ${C_YELLOW}%s${C_RESET}\n" "$MIN_FILES"
      printf "${C_MAGENTA}  ------------------------------------------------------------${C_RESET}\n"

      ELAPSED=0
      while [ $ELAPSED -lt $MAX_WAIT_SECONDS ]; do
        PCT=$((ELAPSED * 100 / MAX_WAIT_SECONDS))
        printf "${C_BLUE}  [%3d%%]${C_RESET} Scanning ${C_YELLOW}%s${C_RESET}\n" "$PCT" "$DIR_NAME"

        git fetch origin "$FRAMEWORK_BRANCH" --quiet 2>/dev/null || true
        git checkout "origin/$FRAMEWORK_BRANCH" -- "$DIR_NAME" 2>/dev/null || true

        if [ -d "$DIR_NAME" ]; then
          COUNT=$(find "$DIR_NAME" -type f -name "$FILE_PATTERN" 2>/dev/null | wc -l)
          printf "         Files found: ${C_CYAN}%s${C_RESET} (min %s)\n" "$COUNT" "$MIN_FILES"

          if [ "$COUNT" -ge "$MIN_FILES" ]; then
            printf "\n"
            printf "${C_BG_GREEN}${C_WHITE}${C_BOLD}  [ PASS ] ${C_RESET} %s files detected\n" "$COUNT"
            find "$DIR_NAME" -type f -name "$FILE_PATTERN" | head -10 | sed "s|^|         ${C_CYAN}|;s|$|${C_RESET}|"
            printf "\n"
            exit 0
          fi
        fi

        sleep "$CHECK_INTERVAL"
        ELAPSED=$((ELAPSED + CHECK_INTERVAL))
      done

      printf "\n"
      printf "${C_BG_YELLOW}${C_BOLD}  [ TIMEOUT ] ${C_RESET} after %ss\n" "$MAX_WAIT_SECONDS"
      exit 1
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - "$DIR_NAME/"
    expire_in: 30 days

# ----------------------------------------------------------------------------
# Template: .quality-gate
# Base for quality validation jobs with artifact reports.
# ----------------------------------------------------------------------------
.quality-gate:
  timeout: 15m
  artifacts:
    name: "$CI_JOB_NAME-report"
    paths:
      - "reports/"
    expire_in: 7 days
    when: always
