# Sprint N Template - Parametrized for multi-sprint support
# Variables: SPRINT_NUM (required)
#
# Wave execution order (TDD, with parallelization):
#
#   [infrastructure]
#        |
#   +----+----+
#   |         |
#   v         v
# [3a-BE-tests] [5a-FE-tests]    <- parallel
#   |              |
#   v              v
# [3b-BE-impl]  [5b-FE-impl]     <- parallel
#   |              |
#   +------+-------+
#          |
#          v
#     [validation]
#          |
#          v
#      [quality]

variables:
  SPRINT: "${SPRINT_NUM}"

stages:
  - infrastructure
  - development
  - validation
  - quality

# Wave 0: Infrastructure
"wave-0:infrastructure":
  stage: infrastructure
  image: docker:24-dind
  script:
    - echo "Sprint ${SPRINT} - Wave 0 Infrastructure"
    - echo "Agent 12 infrastructure deployment"
  rules:
    - when: manual
      allow_failure: true

# Wave 3a: Backend Tests FIRST (TDD Red)
"wave-3a:backend-tests":
  stage: development
  image: python:3.12-slim
  needs: ["wave-0:infrastructure"]
  script:
    - echo "Sprint ${SPRINT} - Wave 3a Backend Tests (TDD Red Phase)"
    - echo "Agent 13 writes pytest tests from specs"
    - echo "All tests MUST fail (no implementation yet)"
  rules:
    - when: manual
      allow_failure: true

# Wave 5a: Frontend Tests FIRST (TDD Red) - PARALLEL with 3a
"wave-5a:frontend-tests":
  stage: development
  image: node:20-slim
  needs: ["wave-0:infrastructure"]
  script:
    - echo "Sprint ${SPRINT} - Wave 5a Frontend Tests (TDD Red Phase)"
    - echo "Agent 15 writes Vitest tests from specs"
    - echo "All tests MUST fail (no components yet)"
  rules:
    - when: manual
      allow_failure: true

# Wave 3b: Backend Implementation (TDD Green)
"wave-3b:backend-impl":
  stage: development
  image: python:3.12-slim
  needs: ["wave-3a:backend-tests"]
  script:
    - echo "Sprint ${SPRINT} - Wave 3b Backend Implementation (TDD Green Phase)"
    - echo "Agent 14 implements FastAPI code to make tests pass"
    - cd backend && python -m pytest tests/ -v || true
  rules:
    - when: manual
      allow_failure: true

# Wave 5b: Frontend Implementation (TDD Green) - PARALLEL with 3b
"wave-5b:frontend-impl":
  stage: development
  image: node:20-slim
  needs: ["wave-5a:frontend-tests"]
  script:
    - echo "Sprint ${SPRINT} - Wave 5b Frontend Implementation (TDD Green Phase)"
    - echo "Agent 16 implements React code to make tests pass"
    - cd frontend && npx vitest run || true
  rules:
    - when: manual
      allow_failure: true

# Validation: runs after BOTH backend and frontend complete
"validation:integration":
  stage: validation
  image: python:3.12-slim
  needs: ["wave-3b:backend-impl", "wave-5b:frontend-impl"]
  script:
    - echo "Sprint ${SPRINT} - Validation Phase"
    - echo "Agents 17 (integration), 18 (e2e), 19 (smoke), 20 (linting), 21 (security)"
  rules:
    - when: manual
      allow_failure: true

# Quality: final gates
"quality:gates":
  stage: quality
  image: python:3.12-slim
  needs: ["validation:integration"]
  script:
    - echo "Sprint ${SPRINT} - Quality Phase"
    - echo "Agents 22 (compliance), 23 (quick-ref), 24 (build-deploy)"
  rules:
    - when: manual
      allow_failure: true
