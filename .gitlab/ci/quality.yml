# ============================================================================
# Child Pipeline: QUALITY GATES
# ============================================================================
# Agents 19 (Security), 20 (Linting), Framework validators
# ============================================================================

include:
  - local: .gitlab/ci/_templates.yml

stages:
  - security
  - linting
  - framework-integrity

"19: security-review":
  stage: security
  extends: .wait-for-file
  variables:
    AGENT_LABEL: "Agent 19 - Security Review (Final OWASP Audit)"
    FILE_NAME: "outputs/19_security_review_report.md"
    REQUIRED_SECTIONS: "OWASP|Findings|Risk Level"

"20: linting-validator":
  stage: linting
  extends: .quality-gate
  script:
    - |
      echo ""
      echo "  ================================================"
      echo "  Agent 20 - Linting Validator (zero-warning)"
      echo "  ================================================"
      mkdir -p reports
      FAIL=0

      echo "  [1/2] Backend linting..."
      if command -v ruff >/dev/null 2>&1 && [ -d backend ] && find backend -name "*.py" -type f | head -1 | grep -q .; then
        ruff check backend/ > reports/ruff.log 2>&1 && echo "        OK" || { echo "        FAIL"; FAIL=1; }
      else
        echo "        SKIP"
      fi

      echo "  [2/2] Frontend linting..."
      if [ -f frontend/package.json ]; then
        (cd frontend && npm run lint > ../reports/eslint.log 2>&1) && echo "        OK" || { echo "        FAIL"; FAIL=1; }
      else
        echo "        SKIP"
      fi

      echo ""
      if [ $FAIL -eq 1 ]; then
        echo "  >> LINTING: FAIL"
        exit 1
      fi
      echo "  >> LINTING: PASS (0 errors, 0 warnings)"
  allow_failure: true

"framework: fastapi-mandate":
  stage: framework-integrity
  extends: .quality-gate
  script:
    - |
      echo ""
      echo "  ================================================"
      echo "  Framework FastAPI Mandate Integrity"
      echo "  ================================================"
      mkdir -p reports

      if [ ! -d "agents" ] || [ ! -d "skills" ]; then
        echo "  SKIP - Not the Framework repo (project mode)"
        echo "PASS (skipped)" > reports/fastapi-mandate.log
        exit 0
      fi

      if [ ! -f "scripts/workflow/validate-no-nestjs-contamination.sh" ]; then
        echo "  WARN - Validator script not found"
        echo "PASS (no validator)" > reports/fastapi-mandate.log
        exit 0
      fi

      bash scripts/workflow/validate-no-nestjs-contamination.sh | tee reports/fastapi-mandate.log
  allow_failure: true
