framework: Django
language: python
test_runner: pytest
linter: ruff
type_checker: mypy
package_manager: pip
build_command: "python manage.py runserver 0.0.0.0:8000"
test_command: "python -m pytest tests/ -v"
lint_command: "ruff check ."
type_check_command: "mypy ."
ci_image: "python:3.12-slim"
project_file: "pyproject.toml"
src_dir: "."
test_dir: "tests"
forbidden_patterns:
  - "@nestjs"
  - "express"
  - "nest-cli.json"
rules:
  - common/framework-rules.md
  - common/tdd-rules.md
  - common/agent-sequence-rules.md
  - django/stack-rules.md
applicable_skills:
  - ddd-clean-architecture.md
  - security-best-practices.md
  - testing-patterns.md
  - configuration-management.md
  - openapi-code-generation.md
  - api-dx-design.md
  - django/patterns.md
  - django/testing.md
  - django/orm-ddd.md
