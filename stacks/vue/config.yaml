framework: Vue
language: typescript
test_runner: vitest
linter: eslint
type_checker: vue-tsc
package_manager: npm
build_command: "npm run build"
test_command: "npx vitest run"
lint_command: "npx eslint src/"
type_check_command: "npx vue-tsc --noEmit"
ci_image: "node:20-slim"
project_file: "package.json"
src_dir: "src"
test_dir: "src/__tests__"
forbidden_patterns: []
rules:
  - common/framework-rules.md
  - common/tdd-rules.md
  - common/agent-sequence-rules.md
  - vue/stack-rules.md
applicable_skills:
  - vue/component-patterns.md
  - vue/state-management.md
  - react/accessibility.md
  - react/api-client.md
  - react/typescript-quality.md
