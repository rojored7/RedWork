# ============================================================================
# RedWork Framework CI (GitLab mirror — MINIMAL and honest)
# ============================================================================
# The canonical CI is GitHub Actions (.github/workflows/framework-ci.yml).
# This file exists only so a GitLab mirror still validates pushes. Everything
# here executes and blocks; no stage waits for a human, none tolerates
# failure, and there is no child-pipeline theater. Shipping is out of scope.
# ============================================================================

stages:
  - test-framework

"test-framework: validate":
  stage: test-framework
  image: python:3.12-slim
  timeout: 10m
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash grep >/dev/null
    - pip install pytest pyyaml >/dev/null 2>&1
  script:
    - python -m pytest tests/ -v --tb=short
    - bash scripts/workflow/validate-no-nestjs-contamination.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

"test-framework: security-scan":
  stage: test-framework
  image: python:3.12-slim
  timeout: 5m
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash grep >/dev/null
  script:
    - bash scripts/security/scan-secrets.sh .
    - bash scripts/security/scan-config.sh .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
