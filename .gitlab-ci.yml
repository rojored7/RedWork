# GitLab CI/CD Pipeline - Agent Workflow Visualization
# 20 agents connected as visual workflow nodes

stages:
  - discovery
  - planning
  - infrastructure
  - development
  - testing
  - quality

# PHASE 1: DISCOVERY (Agents 01-05)

agent_01_product_discovery:
  stage: discovery
  script:
    - echo "Executing Agent 01 - Product Discovery"
    - ls -la agents/
    - echo "Agent 01 completed"
  when: manual

agent_02_domain_modeling:
  stage: discovery
  script:
    - echo "Executing Agent 02 - Domain Modeling"
    - echo "Agent 02 completed"
  needs: ["agent_01_product_discovery"]
  when: manual

agent_03_context_mapping:
  stage: discovery
  script:
    - echo "Executing Agent 03 - Context Mapping"
    - echo "Agent 03 completed"
  needs: ["agent_02_domain_modeling"]
  when: manual

agent_04_architecture_decision:
  stage: discovery
  script:
    - echo "Executing Agent 04 - Architecture Decision"
    - echo "Agent 04 completed"
  needs: ["agent_03_context_mapping"]
  when: manual

agent_05_service_design:
  stage: discovery
  script:
    - echo "Executing Agent 05 - Service Design"
    - echo "Agent 05 completed"
  needs: ["agent_04_architecture_decision"]
  when: manual

# PHASE 2: PLANNING (Agents 06-09)

agent_06_epic_generation:
  stage: planning
  script:
    - echo "Executing Agent 06 - Epic Generation"
    - echo "Agent 06 completed"
  needs: ["agent_05_service_design"]
  when: manual

agent_07_user_story_generation:
  stage: planning
  script:
    - echo "Executing Agent 07 - User Story Generation"
    - echo "Agent 07 completed"
  needs: ["agent_06_epic_generation"]
  when: manual

agent_08_tech_lead_delivery:
  stage: planning
  script:
    - echo "Executing Agent 08 - Tech Lead Delivery"
    - echo "Agent 08 completed"
  needs: ["agent_07_user_story_generation"]
  when: manual

agent_09_sprint_orchestrator:
  stage: planning
  script:
    - echo "Executing Agent 09 - Sprint Orchestrator"
    - echo "Agent 09 completed"
  needs: ["agent_08_tech_lead_delivery"]
  when: manual

# PHASE 3: INFRASTRUCTURE (Agent 12)

agent_12_infrastructure:
  stage: infrastructure
  script:
    - echo "Executing Agent 12 - Infrastructure Deployment"
    - echo "Agent 12 completed"
  needs: ["agent_09_sprint_orchestrator"]
  when: manual

# PHASE 4: DEVELOPMENT (Agents 10-11, 13-14, 20)

agent_10_backend_dev:
  stage: development
  script:
    - echo "Executing Agent 10 - Backend Development"
    - echo "Agent 10 completed"
  needs: ["agent_12_infrastructure"]
  when: manual

agent_13_backend_test:
  stage: development
  script:
    - echo "Executing Agent 13 - Backend Test"
    - echo "Agent 13 completed"
  needs: ["agent_10_backend_dev"]
  when: manual

agent_11_frontend_dev:
  stage: development
  script:
    - echo "Executing Agent 11 - Frontend Development"
    - echo "Agent 11 completed"
  needs: ["agent_12_infrastructure"]
  when: manual

agent_14_frontend_test:
  stage: development
  script:
    - echo "Executing Agent 14 - Frontend Test"
    - echo "Agent 14 completed"
  needs: ["agent_11_frontend_dev"]
  when: manual

agent_20_linting_backend:
  stage: development
  script:
    - echo "Executing Agent 20 - Linting Backend"
    - echo "Agent 20 completed"
  needs: ["agent_13_backend_test"]
  when: manual

agent_20_linting_frontend:
  stage: development
  script:
    - echo "Executing Agent 20 - Linting Frontend"
    - echo "Agent 20 completed"
  needs: ["agent_14_frontend_test"]
  when: manual

# PHASE 5: TESTING (Agents 15-16, 18)

agent_15_integration_test:
  stage: testing
  script:
    - echo "Executing Agent 15 - Integration Test"
    - echo "Agent 15 completed"
  needs: ["agent_20_linting_backend", "agent_20_linting_frontend"]
  when: manual

agent_16_e2e_test:
  stage: testing
  script:
    - echo "Executing Agent 16 - E2E Test"
    - echo "Agent 16 completed"
  needs: ["agent_15_integration_test"]
  when: manual

agent_18_smoke_test:
  stage: testing
  script:
    - echo "Executing Agent 18 - Smoke Test"
    - echo "Agent 18 completed"
  needs: ["agent_16_e2e_test"]
  when: manual

# PHASE 6: QUALITY (Agents 19-20)

agent_19_security_review:
  stage: quality
  script:
    - echo "Executing Agent 19 - Security Review"
    - echo "Agent 19 completed"
  needs: ["agent_18_smoke_test"]
  when: manual

agent_20_linting_final:
  stage: quality
  script:
    - echo "Executing Agent 20 - Final Linting"
    - echo "PRODUCTION READY"
  needs: ["agent_19_security_review"]
  when: manual
